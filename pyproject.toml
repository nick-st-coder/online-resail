[project]
name = "online-retail"
version = "0.1.0"
description = "Customer segmentation with unsupervised learning using the Online Retail II dataset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "scikit-learn>=1.6,<2",
    "scipy>=1.13,<2",
    "statsmodels>=0.14,<1",
    "jupyter>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]